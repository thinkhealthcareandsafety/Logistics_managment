<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>ThinkHealth Logistics | Multi-Courier Shipment Tracking for Healthcare Supply</title>
    <meta
      name="description"
      content="Track every consignment across 1,600+ couriers - Shree Maruti, Delhivery, Blue Dart, DTDC, India Post and more - in one dashboard, with late-delivery alerts, WhatsApp and email notifications, and no-login tracking pages for your customers. Built for pharmacy and hospital supply."
    />
    <meta name="theme-color" content="#0f4c5c" />

    <!-- Set to your real domain before launch: these drive the link preview when the
         page is shared on WhatsApp, LinkedIn or email. -->
    <link rel="canonical" href="https://thinkhealth.example/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ThinkHealth Logistics" />
    <meta property="og:title" content="Shipment tracking your operations team can act on" />
    <meta
      property="og:description"
      content="One dashboard for every consignment you have in the air, whichever courier carries it — and a tracking page you can hand straight to the customer."
    />
    <meta property="og:url" content="https://thinkhealth.example/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shipment tracking your operations team can act on" />
    <meta
      name="twitter:description"
      content="One dashboard for every consignment you have in the air, whichever courier carries it — and a tracking page you can hand straight to the customer."
    />
  </head>
  <body>
    <!-- Shown the instant the page arrives, before any script has loaded; React replaces it.
         Plain HTML + the app's own stylesheet, so nothing extra to download. -->
    <div id="root">
      <div class="top-progress"></div>
      <div class="min-h-screen bg-slate-50" aria-busy="true" aria-label="Loading ThinkHealth Logistics">
        <div class="border-b border-slate-200 bg-white">
          <div class="mx-auto flex h-16 max-w-7xl items-center gap-3 px-4 sm:px-6">
            <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-900 text-[13px] font-bold text-white">TH</span>
            <span class="text-[15px] font-semibold text-slate-900">ThinkHealth Logistics</span>
            <span class="ml-6 hidden h-3.5 w-64 shimmer rounded bg-slate-200 sm:block"></span>
          </div>
        </div>
        <div class="mx-auto max-w-7xl space-y-6 px-4 py-6 sm:px-6 sm:py-8">
          <div class="space-y-2">
            <div class="h-7 w-40 shimmer rounded bg-slate-200"></div>
            <div class="h-3.5 w-72 max-w-full shimmer rounded bg-slate-200"></div>
          </div>
          <div class="grid grid-cols-2 gap-px overflow-hidden rounded-xl border border-slate-200 bg-slate-200 lg:grid-cols-4">
            <div class="h-24 shimmer bg-white"></div>
            <div class="h-24 shimmer bg-white"></div>
            <div class="h-24 shimmer bg-white"></div>
            <div class="h-24 shimmer bg-white"></div>
          </div>
          <div class="space-y-3 rounded-xl border border-slate-200 bg-white p-5">
            <div class="h-4 w-1/3 shimmer rounded bg-slate-200"></div>
            <div class="h-4 w-2/3 shimmer rounded bg-slate-100"></div>
            <div class="h-4 w-1/2 shimmer rounded bg-slate-100"></div>
            <div class="h-4 w-3/5 shimmer rounded bg-slate-100"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
